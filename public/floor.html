<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;font-family:"DFVN Gatsby Gilmour",Georgia,serif}
#pano{position:absolute;inset:0}

/* kích thước viền/quầng sáng tính theo pixel màn hình: nhân --k (= 1 / mức thu phóng mặt bằng) */
.un{position:absolute;box-sizing:border-box;border:calc(2px * var(--k)) solid rgba(255,248,236,.95);border-radius:calc(4px * var(--k));box-shadow:0 0 calc(12px * var(--k)) calc(2px * var(--k)) rgba(255,236,205,.6),inset 0 0 calc(10px * var(--k)) rgba(255,236,205,.35);animation:unin .45s cubic-bezier(.3,1.3,.5,1) both}
.un::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--bg);opacity:.15;transition:opacity .25s}
.un{pointer-events:auto;cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .25s}
.un:hover{border-color:#fff;box-shadow:0 0 calc(22px * var(--k)) calc(5px * var(--k)) rgba(255,240,215,.85),inset 0 0 calc(16px * var(--k)) rgba(255,240,215,.5);z-index:2}
.un:hover::before{opacity:.22}
.un.on{border-color:#fff;z-index:3;animation:unin .45s cubic-bezier(.3,1.3,.5,1) both,unglow 1.6s ease-in-out .45s infinite}

#pbox.anim.slow{transition:transform .9s cubic-bezier(.4,0,.2,1)}
#pzoom{position:fixed;z-index:12;right:max(10px,.9vw);bottom:calc(max(64px, 2.96vh + 56px) + 112px);width:47px;padding:8px 0;display:none;flex-direction:column;align-items:center;gap:4px;border:1px solid rgba(239,238,234,.45);border-radius:20px;background:rgba(31,23,17,.5);box-shadow:0 0 10px rgba(0,0,0,.25);backdrop-filter:blur(3px)}
body.m2d.sel #pzoom{display:flex;animation:fin .5s}
#pzoom button{width:34px;height:34px;padding:5px;border:0;border-radius:50%;background:none;cursor:pointer;transition:background .2s}
#pzoom button:hover{background:rgba(239,238,234,.18)}
#pzoom svg{width:100%;height:100%;fill:none;stroke:#EFEEEA;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#umodal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.62);backdrop-filter:blur(4px);animation:fin .3s}

#umodal h4{margin:4px 44px 12px;font:400 20px/24px "DFVN Gatsby Gilmour",Georgia,serif;text-transform:uppercase;color:#EFEEEA;text-align:center}

#umodal .u360:hover{transform:translate(-50%,calc(50% - 2px));filter:brightness(1.05)}

/* huy hiệu 360° trên nút 2BR / 3BR */

@media(max-width:700px){#room .rback{height:34px;line-height:34px;padding:0 18px;font-size:14px;top:12px;right:14px}#room .rtg button{height:34px;line-height:34px;padding:0 14px;font-size:14px}#umodal .u360{height:44px;line-height:34px;padding:0 22px;font-size:14px;border-width:4px}}
@keyframes unglow{0%,100%{box-shadow:0 0 calc(12px * var(--k)) calc(3px * var(--k)) rgba(255,240,215,.6),inset 0 0 calc(10px * var(--k)) rgba(255,240,215,.3)}50%{box-shadow:0 0 calc(30px * var(--k)) calc(9px * var(--k)) rgba(255,240,215,.95),inset 0 0 calc(20px * var(--k)) rgba(255,240,215,.6)}}
.un[data-type=studio]{--bg:#E4D7C7}.un[data-type=pn2]{--bg:#887869}.un[data-type=pn3]{--bg:#9F827E}

  #plan{left:8px;right:8px;top:158px;bottom:150px}
}

<body>
<div id="loading">Đang tải…</div>
<div id="pano"></div>
<div id="plan"><div id="pbox"><img id="planimg" alt="Mặt bằng 2D" draggable="false"><div id="units"></div></div></div>
<img id="logo" src="/brand/logo.webp" alt="Logo" width="128" height="29" draggable="false">
<a id="back" href="/matbang?end=1">Quay lại</a>
<div id="pzoom"><button type="button" data-k="1.5" aria-label="Phóng to"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20M10.5 7.5v6M7.5 10.5h6"/></svg></button><button type="button" data-k="0.6667" aria-label="Thu nhỏ"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20M7.5 10.5h6"/></svg></button><button type="button" data-k="0" aria-label="Vừa khung"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button></div>
<div id="umodal" hidden><div class="ubox"><button class="ux" type="button" aria-label="Đóng">&times;</button><h4 id="utitle"></h4><img id="uimg" alt="" draggable="false" decoding="async"><button class="u360" type="button" hidden>Xem ảnh 360</button></div></div>
<div id="room" role="dialog" aria-modal="true" aria-label="Ảnh 360 căn hộ"><div id="rpano"></div><div class="rld">Đang tải ảnh 360…</div><button class="rback" type="button">Quay lại</button><div class="rtg"><button type="button" data-k="pn2">Căn hộ 2BR</button><button type="button" data-k="pn3">Căn hộ 3BR</button></div></div>
<div id="label"></div>
<div id="phint">Chọn tầng để xem mặt bằng</div>

<script src="/vendor/pannellum.js" defer></script>
<script type="module">
import { initMenu } from '/menu.js';
// vào từ trang Phân tầng → quay lại đó; vào từ video tách tầng → về khung cuối
if (/\/phantang/.test(document.referrer) || new URLSearchParams(location.search).get('from') === 'pt') document.getElementById('back').href = '/phantang';
const tour = await (await fetch('/api/tour')).json();
// hotspot ở trang phân tầng còn dùng mã tầng cũ (f…) → đổi sang mã tầng có mặt bằng riêng (t…)
const ALIAS = { f40: 't40', f36: 't3638', f35: 't35', f21: 't2134', f20: 't20', f4: 't3a', f13: 't3a' };
const id0 = new URLSearchParams(location.search).get('id');
const id = tour.floors.items.some((x) => x.id === id0) ? id0 : ALIAS[id0] || id0;
const fl = tour.floors, item = fl.items.find((x) => x.id === id) || fl.items[fl.items.length - 1];
const loading = document.getElementById('loading');
if (!item) { loading.textContent = 'Không tìm thấy tầng này.'; throw new Error('no floor'); }
document.title = item.title + ' - Pristine Tower';
document.getElementById('label').textContent = item.title + (item.sub ? ' · ' + item.sub : '');
// ảnh 360 chung: bản 8K cho máy tính có GPU đủ mạnh, còn lại dùng bản 4K
const maxTex = (() => { try { const g = document.createElement('canvas').getContext('webgl'); return g ? g.getParameter(g.MAX_TEXTURE_SIZE) : 0; } catch (e) { return 0; } })();
const big = maxTex >= 8192 && !matchMedia('(max-width:1024px), (pointer:coarse)').matches;
const slowNet = (() => { const c = navigator.connection || {}; return !!c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''); })();
const isRoof = !item.pano && fl.defaultPano === '/home/rooftop.webp';
const pano = item.pano || (isRoof ? '/home/rooftop.webp?v=2' : fl.defaultPano), plan = item.plan || fl.defaultPlan;
const pano8k = isRoof && big ? '/home/rooftop-8k.webp?v=2' : null;

const isMobile = matchMedia('(max-width:768px), (orientation:portrait)').matches;
const start = { hfov: 100, ...((isMobile && item.viewMobile) || item.view || {}) };
if (!isMobile) start.hfov = Math.max(start.hfov, 120);
// hfov đã lưu ứng với màn 16:9; màn rộng hơn thì mở rộng hfov để giữ góc nhìn dọc, tránh bị zoom sát
const fitHfov = (h) => { const a = innerWidth / innerHeight; if (a <= 16 / 9) return h; const r = Math.PI / 180; return Math.min(140, 2 * Math.atan(Math.tan(h * r / 2) / (16 / 9) * a) / r); };
let viewer = null, lastFit = fitHfov(start.hfov);
// ảnh 360 chỉ tải khi thật sự xem chế độ 360 (mở thẳng 2D thì hoãn lại)
const makeViewer = () => {
  loading.style.display = '';
  const sc0 = { type: 'equirectangular', panorama: pano, autoLoad: true, ...start, hfov: fitHfov(start.hfov) };
  viewer = window.viewer = pannellum.viewer('pano', { default: { firstScene: 'm', showControls: false, maxHfov: isMobile ? 120 : 140, sceneFadeDuration: 500 }, scenes: { m: sc0 } });
  let upped = false, drag = false;
  viewer.on('mousedown', () => { drag = true; }); viewer.on('mouseup', () => { drag = false; });
  viewer.on('touchstart', () => { drag = true; }); viewer.on('touchend', () => { drag = false; });
  const swap = () => { if (drag) return setTimeout(swap, 500); viewer.loadScene('m', viewer.getPitch(), viewer.getYaw(), viewer.getHfov()); };
  viewer.on('load', () => {
    loading.style.display = 'none';
    // mở bằng 4K cho nhanh; máy đủ mạnh tải 8K ở nền rồi thay vào, giữ hướng nhìn
    if (!pano8k || upped) return; upped = true;
    const run = () => { const im = new Image(); im.fetchPriority = 'low'; im.onload = () => { sc0.panorama = pano8k; swap(); }; im.src = pano8k; };
    slowNet ? (window.requestIdleCallback || ((f) => setTimeout(f, 1500)))(run, { timeout: 6000 }) : setTimeout(run, 300);
  });
  viewer.on('error', () => { loading.textContent = 'Không tải được ảnh 360.'; });
};
addEventListener('resize', () => { const h = fitHfov(start.hfov); if (viewer && Math.abs(viewer.getHfov() - lastFit) < 0.5) viewer.setHfov(h, false); lastFit = h; });

// VIEW 2D: ảnh mặt bằng, kéo để di chuyển, cuộn/chụm để phóng to
const planEl = document.getElementById('plan'), img = document.getElementById('planimg');
let sc = 1, tx = 0, ty = 0, base = 1;
const box = document.getElementById('pbox');
const apply = () => { box.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; box.style.setProperty('--k', 1 / (sc || 1)); };
const clamp = () => {
  const w = img.naturalWidth * sc, h = img.naturalHeight * sc;
  const cw = planEl.clientWidth, ch = planEl.clientHeight;
  tx = w <= cw ? (cw - w) / 2 : Math.min(0, Math.max(cw - w, tx));
  ty = h <= ch ? (ch - h) / 2 : Math.min(0, Math.max(ch - h, ty));
};
// vùng có nội dung của ảnh mặt bằng (bỏ nền trống xung quanh), đo 1 lần mỗi ảnh trên bản thu nhỏ
const bboxCache = {};
const contentBox = () => {
  const k = img.currentSrc || img.src; if (bboxCache[k] !== undefined) return bboxCache[k];

const types = fl.unitTypes || [];

const ROOM360 = { pn2: 1, pn3: 1 };

  umodal.hidden = false;

const closeUnit = () => { umodal.hidden = true; unitsEl.querySelectorAll('.un.on').forEach((x) => x.classList.remove('on')); };
const warmed = new Set();
unitsEl.addEventListener('pointerover', (e) => {
  const k = CUTAWAY[e.target.dataset && e.target.dataset.type];
  if (k && !warmed.has(k)) { warmed.add(k); const im = new Image(); im.decoding = 'async'; im.sizes = Math.round(Math.min(innerWidth * 0.92, 1100, innerHeight * 0.88 - 80)) + 'px'; im.srcset = `/home/units/${k}-1200.webp 1200w, /home/units/${k}.webp 2400w`; }
});

addEventListener('keydown', (e) => { if (e.key === 'Escape' && !umodal.hidden) closeUnit(); });
// ---------- ảnh 360 căn hộ mẫu (2BR / 3BR): chỉ tải khi bấm; mở 4K trước, máy tính đủ mạnh nâng lên 8K ở nền ----------
const room = document.getElementById('room'), u360 = umodal.querySelector('.u360'), rld = room.querySelector('.rld');
const rConn = navigator.connection || {}, rSlow = !!rConn.saveData || /(^|-)2g|3g/.test(rConn.effectiveType || '');
const rBig = maxTex >= 8192 && !matchMedia('(max-width:1024px), (pointer:coarse)').matches;
const rIdle = (fn) => (window.requestIdleCallback || ((f) => setTimeout(f, 800)))(fn, { timeout: rSlow ? 6000 : 2000 });
const rUrl = (k, r) => `/home/units/pano-${k}-${r}.webp?v=1`;
let rViewer = null, rUp = new Set(), rBusy = false, rDrag = false;
// rê / chạm vào nút xem 360: nạp sẵn ảnh 4K của căn đó
const rWarmed = new Set();

const ORDER = ['studio', 'pn15', 'pn2', 'pn21', 'pn22', 'pn3', 'duplex', 'dualkey', 'penthouse'];

};
// chọn loại căn: phóng tới vùng các căn đó (chuyển động mượt), 1,6 giây sau tự mở popup căn;
// người xem kéo / cuộn / bấm chỗ khác trong lúc chờ thì huỷ mở popup
let focusT = 0;
const cancelFocus = () => clearTimeout(focusT);
function focusType() {
  cancelFocus();

  const W = img.naturalWidth, H = img.naturalHeight, cw = planEl.clientWidth, ch = planEl.clientHeight;
  // phóng tới căn sẽ mở popup (căn đầu của loại đó), căn chiếm khoảng 45% khung
  const f = us[0], x0 = f.x * W, y0 = f.y * H, x1 = (f.x + f.w) * W, y1 = (f.y + f.h) * H;
  base = Math.min(cw / W, ch / H) || 1;

  box.classList.add('anim', 'slow'); clamp(); apply(); setTimeout(() => box.classList.remove('anim', 'slow'), 950);
  const t = curType, uid = us[0].id || '';

    if (curType !== t || !umodal.hidden) return;

planEl.addEventListener('pointerdown', cancelFocus); planEl.addEventListener('wheel', cancelFocus, { passive: true });

// danh sách tầng từ thấp lên cao (3A trên cùng)
document.getElementById('pfl').innerHTML = fl.items.slice().reverse().map((x) => `<button class="pi" type="button" data-id="${x.id}">${x.title}</button>`).join('');
// bấm chọn tầng xong mới hiện mặt bằng và bảng căn hộ
document.getElementById('pfl').onclick = (e) => {
  const b = e.target.closest('.pi'); if (!b) return;
  const x = fl.items.find((y) => y.id === b.dataset.id); if (!x) return;
  document.querySelectorAll('#pfl .pi').forEach((el) => el.classList.toggle('on', el === b));

  const src = x.plan || fl.defaultPlan;

if (curBtn) curBtn.click();

const start2d =new URLSearchParams(location.search).get('view') === '2d';
if (start2d) { document.body.classList.add('m2d'); loading.style.display = 'none'; } else makeViewer();
initMenu(document.getElementById('ui'), start2d ? 'xoay' : 'fly', {
  tab: 'matbang', toggleLabels: ['View 360', 'View 2D'], noToggle: start2d, // vào thẳng 2D (từ nhãn Tầng căn hộ): ẩn công tắc View 360
  onToggle: (i) => { document.body.classList.toggle('m2d', i === 1); if (i === 1) { if (img.dataset.src && img.getAttribute('src') !== img.dataset.src) img.src = img.dataset.src; if (document.body.classList.contains('sel')) requestAnimationFrame(() => { if (img.naturalWidth) { fitPlan(); renderUnits(); } document.querySelector('#pfl .pi.on')?.scrollIntoView({ block: 'nearest' }); }); } else if (!viewer) makeViewer(); else requestAnimationFrame(() => viewer.resize()); }
