<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang chủ - Pristine Tower</title>
<link rel="preload" href="/fonts/DFVN-Gatsby-Gilmour.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SVN-Spyrel-Medium.woff2" as="font" type="font/woff2" crossorigin>
<script>/* tải dữ liệu ngay từ đầu, trang dùng lại đúng kết quả này (API no-store: preload sẽ bị tải 2 lần) */(window.__tour = fetch('/api/tour').then((r) => r.json())).catch(() => {});</script>
<script>/* lần sau vào: tải trước ảnh nền đã biết, không chờ /api/tour */try{var hb=localStorage.getItem("homeBg");if(hb&&/^\/[\w\/.?=-]+$/.test(hb))document.write('<link rel="preload" as="image" fetchpriority="high" href="'+hb+'">')}catch(e){}</script>
<link rel="modulepreload" href="/menu.js">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#stage::before{content:"";position:absolute;inset:-40px;background:var(--bg) center/cover;filter:blur(26px) brightness(.75)}
#bgimg{position:absolute;background:var(--bg) 0 0/100% 100% no-repeat}
#logo{position:fixed;left:22px;top:18px;width:128px;height:auto;z-index:13;pointer-events:none;filter:drop-shadow(0 0 4px rgba(0,0,0,.4))}
/* hotspots */
.hs{position:fixed;margin:calc(var(--hs,44px) / -2) 0 0 calc(var(--hs,44px) / -2);z-index:6;width:var(--hs,44px);height:var(--hs,44px);display:block;border-radius:50%;filter:drop-shadow(0 0 4px rgba(0,0,0,.75));transition:transform .25s cubic-bezier(.3,1.4,.5,1),filter .25s;outline:none;animation:hsfloat 3s ease-in-out infinite}
.hs svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.hs svg path{transform-origin:21.67px 21.67px;transition:transform .5s}
.hs svg circle{transition:fill .25s,stroke-width .25s}
/* trạng thái chờ: vòng sóng lan toả */
.hs::before,.hs::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);opacity:0;animation:hsring 2.4s ease-out infinite}
.hs::after{animation-delay:1.2s}
/* hover: phóng to, sáng, sao xoay */
.hs:hover{transform:scale(1.22);filter:drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 0 4px rgba(0,0,0,.75));animation-play-state:paused}
.hs:hover svg circle{fill:rgba(255,255,255,.35)}
.hs:hover svg path{transform:rotate(90deg) scale(1.1)}
/* focus bàn phím */
.hs:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.7);transform:scale(1.15)}
/* nhấn: co lại */
.hs:active{transform:scale(.88);filter:drop-shadow(0 0 14px #fff)}
/* đang chuyển trang */
.hs.go{animation:hsgo .5s ease-in forwards;pointer-events:none}
.hs .tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,6px);padding:7px 16px;border-radius:20px;background:rgba(31,23,17,.62);border:1px solid rgba(239,238,234,.45);box-shadow:0 0 10px rgba(0,0,0,.3);backdrop-filter:blur(4px);color:#EFEEEA;font:500 14px/18px "DFVN Gatsby Gilmour",Georgia,serif;letter-spacing:.3px;text-transform:uppercase;text-decoration:none;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:2}
.hs:hover .tip,.hs:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
@keyframes hsring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes hsfloat{50%{translate:0 -3px}}
@keyframes hsgo{to{transform:scale(3);opacity:0}}
@media(max-width:700px){#logo{top:14px;left:16px;width:96px}}
#stage.leave{opacity:0;transition:opacity .5s .15s}
</style>
</head>
<body>
<div id="stage">
  <div id="bgimg"></div>
  <img id="logo" src="/brand/logo.webp" alt="Logo" width="128" height="29" draggable="false">
  <div id="ui"></div>


</div>
<script type="module">
import { initMenu, applyHotspotSize } from '/menu.js';
const stage = document.getElementById('stage');
initMenu(document.getElementById('ui'), 'fly', { tab: 'tongthe' });
const tour = await (window.__tour || fetch('/api/tour').then((r) => r.json()));
applyHotspotSize(tour.hotspotSize);
stage.style.setProperty('--bg', `url(${tour.home.bg})`);
try { localStorage.setItem('homeBg', tour.home.bg); } catch (e) {}
for (const h of tour.home.hotspots) stage.insertAdjacentHTML('beforeend', `<a class="hs" data-x="${h.x}" data-y="${h.y}" href="/360.html?scene=${h.target}" aria-label="${h.text.replace(/"/g, '&quot;')}"><span class="tip"></span></a>`);
stage.querySelectorAll('.hs .tip').forEach((t, i) => (t.textContent = tour.home.hotspots[i].text));
// ảnh nền phủ kín (cover) → quy đổi toạ độ thiết kế 1920x1080 sang toạ độ màn hình
const bgimg = document.getElementById('bgimg');
const layout = () => {
  const cover = Math.max(innerWidth / 1920, innerHeight / 1080), contain = Math.min(innerWidth / 1920, innerHeight / 1080);
  // màn ngang quá rộng: giới hạn mức phóng (không cắt quá ~25%), phần thừa hai bên làm mờ
  const s = innerWidth > innerHeight ? Math.min(cover, contain * 1.25) : cover;
  const w = 1920 * s, hgt = 1080 * s;
  let ox = (innerWidth - w) / 2, oy = (innerHeight - hgt) / 2;
  const f = (tour.home.focus || {})[innerWidth < 768 ? 'phone' : innerWidth < 1200 ? 'tablet' : ''];
  if (f) { // điện thoại / tablet: tâm ngang luôn là trục toà nhà (trung bình x các hotspot trên toà), tâm dọc theo admin chọn
    const hx = tour.home.hotspots.length ? tour.home.hotspots.reduce((n, h) => n + h.x, 0) / tour.home.hotspots.length : f.x;
    // chỉ dời tâm theo chiều ảnh rộng hơn màn; chiều ảnh nhỏ hơn màn (màn quá rộng, ảnh bị giới hạn phóng) thì giữ ở giữa
    if (w > innerWidth) ox = Math.min(0, Math.max(innerWidth - w, innerWidth / 2 - hx * s));
    if (hgt > innerHeight) oy = Math.min(0, Math.max(innerHeight - hgt, innerHeight / 2 - f.y * s));
  }
  Object.assign(bgimg.style, { left: ox + 'px', top: oy + 'px', width: w + 'px', height: hgt + 'px' });
  stage.querySelectorAll('.hs').forEach((a) => { a.style.left = ox + a.dataset.x * s + 'px'; a.style.top = oy + a.dataset.y * s + 'px'; });
};
addEventListener('resize', layout); layout();
const star = '<svg viewBox="0 0 43.34 43.34"><circle cx="21.67" cy="21.67" r="19.67" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="4"/><path d="M21.67 9c1.3 7.6 3.1 10.1 10.7 12.67-7.6 2.5-9.4 5-10.7 12.67-1.3-7.6-3.1-10.1-10.7-12.67C18.57 19.1 20.37 16.6 21.67 9z" fill="#fff"/></svg>';
document.querySelectorAll('.hs').forEach((a, i) => {
  a.insertAdjacentHTML('afterbegin', star);
  a.style.animationDelay = i * 0.4 + 's';
  a.addEventListener('click', (e) => { e.preventDefault(); a.classList.add('go'); stage.classList.add('leave'); setTimeout(() => (location.href = a.href), 550); });
});
</script>
</body>
</html>
