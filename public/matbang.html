<script>
// chọn cỡ khung trước khi tải gì khác để preload đúng khung đầu (giữ đồng bộ với pickSize bên dưới)
(() => {
  const c = navigator.connection || {}, slow = c.saveData || /(^|-)2g|3g/.test(c.effectiveType || '');
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight, AR = 3540 / 1536, short = Math.min(W, H);
  // độ phóng mặc định từng thiết bị (khớp DEFAULT_SPLIT_VIEW sau khi đổi sang video V2) → bề rộng ảnh thật sự được vẽ
  const zoom = short < 600 ? (W > H ? 1.286 : 2.144) : (W < 1200 && H > W * 0.8 ? 1.829 : 1.286);
  const need = Math.min(W / AR, H) * zoom * AR * dpr;
  let i = need <= 1050 ? 0 : need <= 1450 ? 1 : need <= 2100 ? 2 : 3;
  if (short < 600) i = Math.min(i, 1); // điện thoại tối đa 1280
  if (slow) i = Math.max(0, i - 1);
  window.SPLIT_W = [960, 1280, 1920, 2560][i];
  window.SPLIT_SLOW = slow;
  // quay lại từ trang tầng / tiện ích (?end=1): dừng sẵn ở khung cuối, nên tải khung cuối trước
  const q = new URLSearchParams(location.search);
  window.SPLIT_END = q.has('end');
  // bấm tầng tiện ích ở Phân tầng (?from=pt): chạy video chuyển cảnh trước (khung t_*, tối đa 1920) rồi nối luôn khung tách tầng
  window.SPLIT_TRANS = q.get('from') === 'pt' && !window.SPLIT_END;
  window.TRANS_W = Math.min(window.SPLIT_W, 1920);
  document.write(window.SPLIT_TRANS
    ? `<link rel="preload" as="image" fetchpriority="high" href="/split/trans/${window.TRANS_W}/t_00.webp?v=1">`
    : `<link rel="preload" as="image" fetchpriority="high" href="/split/${window.SPLIT_W}/f_${window.SPLIT_END ? 49 : '00'}.webp?v=6">`);
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"></noscript>

<style>
*{box-sizing:border-box}
@view-transition{navigation:auto}
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;height:100dvh;background:#000;overflow:hidden;cursor:pointer;touch-action:manipulation}
#stage.done{cursor:default}
#stage.leave{opacity:0;transition:opacity .4s}
/* nền mờ phủ phần màn hình ngoài khung ảnh (màn dọc / tỉ lệ khác 16:9) */
#bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(24px) brightness(.7);transform:scale(1.05)}
#cv{position:absolute;inset:0;width:100%;height:100%}
#logo{position:fixed;left:22px;top:18px;width:128px;height:auto;z-index:13;pointer-events:none;filter:drop-shadow(0 0 4px rgba(0,0,0,.4))}
/* nhãn "Click để xem chi tiết" (Figma: dải 252x26, chữ Inter 20/24) */
#hint{position:absolute;left:50%;bottom:var(--hb,128px);width:252px;height:26px;transform:translateX(-50%);z-index:11;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(31,23,17,.75) 20%,rgba(31,23,17,.75) 80%,rgba(0,0,0,0) 100%);
  font:400 20px/24px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EFEEEA;text-align:center;padding-top:1px;
  text-shadow:1px 2px 2px rgba(0,0,0,.75);transition:opacity .35s;white-space:nowrap}
#hint.off{opacity:0}
#hint{display:none!important} /* tự chạy sau 1.5s, không cần nhãn bấm */
/* hiệu ứng mời bấm: biểu tượng tay nhấp + gợn sóng, chữ thở nhẹ và vệt sáng lướt qua */
#hint{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:0;overflow:visible}
#hint .tx{position:relative;background:linear-gradient(90deg,#EFEEEA 0%,#EFEEEA 40%,#fffbe0 50%,#EFEEEA 60%,#EFEEEA 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hshine 2.8s ease-in-out infinite;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.75));text-shadow:none}
#hint .ic{position:relative;flex:none;width:18px;height:18px;animation:htap 1.6s ease-in-out infinite}
#hint .ic svg{width:100%;height:100%;fill:#EFEEEA;filter:drop-shadow(1px 1px 1px rgba(0,0,0,.6))}
#hint .ic::before,#hint .ic::after{content:'';position:absolute;left:30%;top:8%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid rgba(255,251,200,.9);border-radius:50%;opacity:0;animation:hring 1.6s ease-out infinite}
#hint .ic::after{animation-delay:.25s}
#hint:not(.off){animation:hbreath 2.4s ease-in-out infinite}
@keyframes hshine{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
@keyframes htap{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-2px) scale(1.05)}50%{transform:translateY(1px) scale(.9)}}
@keyframes hring{0%,40%{opacity:0;transform:scale(.4)}50%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
@keyframes hbreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
@media(prefers-reduced-motion:reduce){#hint,#hint *,#hint .ic::before,#hint .ic::after{animation:none!important}#hint .tx{color:#EFEEEA}}
#bar{position:absolute;left:50%;bottom:calc(var(--hb,128px) - 10px);width:160px;height:2px;transform:translateX(-50%);background:rgba(239,238,234,.25);z-index:11;opacity:0;transition:opacity .25s;pointer-events:none}
#bar i{display:block;height:100%;width:0;background:#EFEEEA;transition:width .15s}
#bar.on{opacity:1}
@media(max-width:700px){#logo{top:14px;left:16px;width:96px}}
#back{position:fixed;right:max(16px,2.2vw);top:max(16px,4.1vh);z-index:13;height:40px;padding:0 34px;border:0;border-radius:15px;background:#EFEEEA;color:#4A382A;font:500 17px/40px "SVN-Spyre",Georgia,serif;text-transform:uppercase;cursor:pointer;box-shadow:0 0 10px rgba(0,0,0,.25);text-decoration:none;transition:transform .2s,background .2s}
#back:hover{transform:translateY(-1px);background:#fff}
@media(max-width:700px){#back{height:34px;line-height:34px;padding:0 18px;font-size:14px;top:12px;right:14px}}
@media(max-width:520px),(max-height:520px){#hint{width:200px;height:22px;font-size:15px;line-height:20px}}

/* ---------- hotspot sau khung cuối ---------- */
#hs{position:absolute;inset:0;z-index:10;pointer-events:none;visibility:hidden}
#hs.on{visibility:visible}
#sp{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#sp .gl{fill:none;stroke:#FFFB1C;stroke-width:var(--lw,1px);filter:url(#glow);opacity:.95}
#sp .wl{fill:none;stroke:#fff;stroke-width:var(--lw,1px)}
#sp .fl{fill:none;stroke:#FFFDE0;stroke-width:calc(var(--lw,1px) * 2);stroke-linecap:round;stroke-dasharray:.07 .93;opacity:0;filter:url(#glow)}
#sp .dt{fill:#fff;filter:url(#glow)}
#sp .rg{fill:none;stroke:#FFFB1C;stroke-width:1;opacity:0}
/* hiện dần: chấm bung → đường tự vẽ từ chấm ra thẻ → thẻ mở */
#hs.on .sg path.gl,#hs.on .sg path.wl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s cubic-bezier(.6,0,.3,1) forwards;animation-delay:calc(var(--d) + .18s)}
#hs.on .sg .dt{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
#hs.on .sg .rg{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite;animation-delay:calc(var(--d) + .2s)}
#hs.on .sg .fl{animation:flow 3.2s linear infinite;animation-delay:calc(var(--d) + 1.2s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}80%,100%{opacity:0;transform:scale(4.5)}}
@keyframes flow{0%{opacity:0;stroke-dashoffset:1}12%{opacity:1}70%{opacity:1}100%{opacity:0;stroke-dashoffset:0}}
#hs.instant *{animation-duration:0s!important;animation-delay:0s!important}
#hs.instant .sg .rg,#hs.instant .sg .fl{animation:none!important}

.hc{position:absolute;left:0;top:0;width:var(--w);height:calc(var(--w) * .507);transform:translate(var(--x),var(--y)) translate(-50%,-50%);pointer-events:auto;cursor:pointer;opacity:0;--r:calc(var(--w) * .085)}
.hc .in{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;background:#2a2119;
  box-shadow:0 0 0 1px rgba(255,236,170,.9),0 0 0 calc(var(--w) * .008) rgba(201,168,106,.55),0 calc(var(--w) * .02) calc(var(--w) * .06) rgba(0,0,0,.55)}
.hc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.hc .in::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,rgba(28,20,14,.78) 0%,rgba(28,20,14,.42) 38%,rgba(0,0,0,0) 62%),linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0) 45%)}
.hc .in::after{content:"";position:absolute;inset:-2px;z-index:3;background:linear-gradient(105deg,transparent 35%,rgba(255,251,200,.55) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.hc b{position:absolute;z-index:2;left:7.5%;top:8%;font:400 calc(var(--w) * .135)/1 "DFVN Gatsby Gilmour",Georgia,serif;text-transform:uppercase;color:#fff;letter-spacing:.01em;text-shadow:1px 2px 4px rgba(0,0,0,.45);white-space:nowrap}
.hc span{position:absolute;z-index:2;left:50%;bottom:6%;transform:translateX(-50%);padding:0 9%;height:calc(var(--w) * .1);line-height:calc(var(--w) * .1);border-radius:99px;
  background:rgba(30,26,22,.62);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  font:400 max(9px,calc(var(--w) * .062)) Inter,system-ui,sans-serif;color:#EFEEEA;white-space:nowrap}
.hc:hover img{transform:scale(1.06)}
.hc:hover .in{box-shadow:0 0 0 1px #FFFB9A}
/* thẻ dùng ảnh thiết kế sẵn (tỉ lệ theo ảnh: thẻ 351x189, nhãn tầng 363x117) */
.hc.pic,.hc.pic.fl{height:calc(var(--w) * var(--ar,.538))}
.hc.pic.fl{--ar:.322}
.hc.pic img.full{display:block;width:100%;height:100%;pointer-events:none;transition:transform .35s,filter .35s}
.hc.pic:hover img.full{transform:scale(1.04);filter:brightness(1.06)}
#hs.on .hc{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) + .55s)}
#hs.on .hc .in::after{animation:shine 1.1s ease-out forwards;animation-delay:calc(var(--d) + .85s)}
@keyframes cardIn{0%{opacity:0;clip-path:inset(48% 50% 48% 50% round 12px);filter:brightness(2.2)}45%{opacity:1;clip-path:inset(0 50% 0 50% round 12px)}100%{opacity:1;clip-path:inset(0 0 0 0 round 0);filter:none}}
@keyframes shine{to{transform:translateX(120%)}}
/* nhãn tầng (pill nâu) */
.hc.fl{width:var(--w);height:calc(var(--w) * .26);--r:99px}
.hc.fl .in{background:linear-gradient(90deg,#2C2017 0%,#5B4130 45%,#A57A52 100%);box-shadow:0 0 0 1px rgba(239,238,234,.55),0 calc(var(--w) * .02) calc(var(--w) * .05) rgba(0,0,0,.5)}
.hc.fl .in::before{display:none}
.hc.fl i{position:absolute;z-index:2;left:3.5%;top:50%;width:calc(var(--w) * .2);height:calc(var(--w) * .2);transform:translateY(-50%);border:1px solid rgba(239,238,234,.8);border-radius:50%;display:grid;place-items:center}
.hc.fl i svg{width:52%;height:52%;stroke:#EFEEEA;fill:none;stroke-width:1.6}
.hc.fl small{position:absolute;z-index:2;left:28%;right:4%;top:14%;text-align:center;font:400 calc(var(--w) * .058)/1 Inter,system-ui,sans-serif;color:#EFEEEA}
.hc.fl b{left:28%;right:4%;top:auto;bottom:17%;text-align:center;font:500 calc(var(--w) * .084)/1 "SVN-Spyre",Georgia,serif;letter-spacing:0}
.hc.fl:hover .in{box-shadow:0 0 0 1px #FFFB9A}
/* quét sáng toàn cảnh khi hiện hotspot */
#scan{position:absolute;left:0;right:0;top:0;height:22%;z-index:9;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(255,251,28,.07) 70%,rgba(255,253,220,.35) 98%,transparent);mix-blend-mode:screen}
#scan.go{animation:scan 1s cubic-bezier(.5,0,.5,1) forwards}
@keyframes scan{0%{opacity:1;transform:translateY(-100%)}85%{opacity:1}100%{opacity:0;transform:translateY(480%)}}
/* chế độ sửa (admin) */
#hs.edit .hc{cursor:move}
#hs.edit .hd{fill:#4c7cf0;stroke:#fff;stroke-width:2;cursor:move;pointer-events:all}
#hs.edit .hd.end{fill:#ff9f1a}
#hs.edit .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:copy}
#hs:not(.edit) .hd,#hs:not(.edit) .hit{display:none}

/* ---------- bảng xem ảnh (Figma "bang xem mb" 1600x900) ---------- */
#lb{position:fixed;inset:0;z-index:30;background:transparent;display:none;opacity:0;transition:opacity .3s;cursor:default}
#lb.on{display:block}
#lb.show{opacity:1}
#lb .pn{position:absolute;left:50%;top:calc(50% - 28px * var(--k));width:1600px;height:900px;transform:translate(-50%,-50%) scale(calc(var(--k) * .96));transition:transform .35s cubic-bezier(.2,.8,.2,1);
  background:rgba(0,0,0,.75);box-shadow:0 0 20px rgba(0,0,0,.5);border-radius:20px}
#lb.show .pn{transform:translate(-50%,-50%) scale(var(--k))}
#lb h2{position:absolute;left:50%;top:31px;width:1462px;margin:0;transform:translateX(-50%);font:400 32px/32px "DFVN Gatsby Gilmour",Georgia,serif;text-align:center;text-transform:uppercase;color:#EFEEEA;text-shadow:2px 2px 4px rgba(0,0,0,.25)}
#lb .ph{position:absolute;left:121px;top:86px;width:1357px;height:755px;background:transparent;overflow:hidden}
#lb .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
#lb .ph img.ok{opacity:1}
#lb .x{position:absolute;right:20px;top:20px;width:52px;height:52px;border:0;border-radius:50px;background:rgba(203,199,190,.25);box-shadow:0 0 10px rgba(0,0,0,.25);cursor:pointer;padding:0}
#lb .x::before,#lb .x::after{content:"";position:absolute;left:50%;top:50%;width:27px;height:4px;margin:-2px 0 0 -13.5px;background:#EFEEEA;border-radius:2px;transform:rotate(45deg)}
#lb .x::after{transform:rotate(135deg)}
#lb .x:hover{background:rgba(203,199,190,.4)}
/* điện thoại dọc: bảng đầy màn, chữ và nút theo cỡ thật */
#lb.mob .pn{left:0;top:0;width:100%;height:100%;transform:none;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:16px}
#lb.mob h2{position:static;width:auto;transform:none;font-size:22px;line-height:24px;margin:0 52px 18px}
#lb.mob .ph{position:relative;left:auto;top:auto;width:100%;height:auto;aspect-ratio:1357/755;border-radius:8px}
#lb.mob .x{left:auto;right:14px;top:max(14px,env(safe-area-inset-top));width:40px;height:40px}
#lb.mob .x::before,#lb.mob .x::after{width:20px;height:3px;margin:-1.5px 0 0 -10px}
/* bộ ảnh nhiều tab (Sảnh chính / Sảnh thang): thanh tab viên thuốc, ảnh giữ tỉ lệ, nút ‹ ›, kéo/vuốt */
#lb .tb,#lb .nv,#lb .sw{display:none}
#lb.gal h2{display:none}
#lb.gal .tb{display:flex;position:absolute;left:50%;top:18px;transform:translateX(-50%);gap:4px;padding:5px;border:1.5px solid rgba(239,238,234,.55);border-radius:32px;background:rgba(40,32,26,.55)}
#lb .tb button{border:0;border-radius:26px;padding:12px 38px;background:transparent;color:#EFEEEA;font:400 24px/24px "DFVN Gatsby Gilmour",Georgia,serif;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s;white-space:nowrap}
#lb .tb button.on{background:#F2EEE6;color:#3A2E26;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#lb.gal .ph{top:96px;height:770px;touch-action:pan-y;cursor:grab;user-select:none}
#lb.gal .ph.drag{cursor:grabbing}
#lb.gal .ph img{object-fit:contain;-webkit-user-drag:none}
#lb.gal .nv{display:block;position:absolute;top:50%;width:70px;height:110px;margin-top:-55px;border:0;background:transparent;cursor:pointer;padding:0;opacity:.9}
#lb.gal .nv:hover{opacity:1}
#lb .nv svg{width:100%;height:100%;fill:none;stroke:#EFEEEA;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#lb .nv.p{left:22px}#lb .nv.n{right:22px}
#lb .nv[disabled]{opacity:.25;cursor:default}
#lb.gal .sw{display:flex;position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%) scale(calc(1 / var(--k)));flex-direction:column;align-items:center;gap:10px;padding:16px 22px 12px;border-radius:22px;background:rgba(20,14,10,.5);backdrop-filter:blur(4px);box-shadow:0 0 18px rgba(0,0,0,.3);color:#EFEEEA;font:400 14px/1.3 Inter,system-ui,sans-serif;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#lb.gal .sw.on{opacity:1}
#lb .sw .row{display:flex;align-items:center;gap:6px}
#lb .sw .ar{width:22px;height:22px;fill:none;stroke:#EFEEEA;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
#lb .sw .ar.l{animation:arL 1.6s ease-in-out infinite}#lb .sw .ar.r{animation:arR 1.6s ease-in-out infinite}
#lb .sw .hand{width:40px;height:40px;fill:#EFEEEA;animation:hand 1.6s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
@keyframes hand{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(8deg)}}
@keyframes arL{0%,100%{opacity:1;transform:translateX(-3px)}50%{opacity:.35;transform:none}}
@keyframes arR{0%,100%{opacity:.35;transform:none}50%{opacity:1;transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){#lb .sw .hand,#lb .sw .ar{animation:none}}
#lb.mob.gal .tb{position:static;transform:none;align-self:center;margin:0 48px 16px;max-width:calc(100% - 96px)}
#lb.mob .tb button{font-size:16px;line-height:16px;padding:9px 16px}
#lb.mob.gal .ph{top:auto;aspect-ratio:auto;height:min(70vh,calc(100vw * 1.2))}
#lb.mob.gal .nv{width:40px;height:64px;margin-top:-32px}
#lb.mob .nv.p{left:4px}#lb.mob .nv.n{right:4px}
#lb.mob.gal .sw{transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="cv" role="img" aria-label="Phân tầng toà nhà"></canvas>
  <div id="scan"></div>
  <div id="hs"><svg id="sp"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter></defs><g id="spg"></g></svg></div>
  <div id="hint"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5a1.5 1.5 0 0 1 3 0V11l.6-.1a1.5 1.5 0 0 1 1.9 1l.1.1a1.5 1.5 0 0 1 2.4.6 1.5 1.5 0 0 1 2.5 1.1V17a5 5 0 0 1-5 5h-1.6a5 5 0 0 1-3.9-1.9l-3.3-4.2a1.6 1.6 0 0 1 2.3-2.2L9 15.3z"/></svg></span><span class="tx">Click để xem chi tiết</span></div>
  <div id="bar"><i></i></div>
  <img id="logo" src="/brand/logo.webp" alt="Logo" width="128" height="29" draggable="false">
  <div id="ui"></div>
</div>

<div id="lb" role="dialog" aria-modal="true"><div class="pn"><h2></h2><div class="tb" role="tablist"></div><div class="ph"><img alt="" draggable="false"></div><button class="nv p" type="button" aria-label="Ảnh trước"><svg viewBox="0 0 40 100"><path d="M30 8 10 50l20 42"/></svg></button><button class="nv n" type="button" aria-label="Ảnh sau"><svg viewBox="0 0 40 100"><path d="m10 8 20 42-20 42"/></svg></button><div class="sw" aria-hidden="true"><div class="row"><svg class="ar l" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg><svg class="hand" viewBox="0 0 24 24"><path d="M9 3.5a1.5 1.5 0 0 1 3 0V11l.6-.1a1.5 1.5 0 0 1 1.9 1l.1.1a1.5 1.5 0 0 1 2.4.6 1.5 1.5 0 0 1 2.5 1.1V17a5 5 0 0 1-5 5h-1.6a5 5 0 0 1-3.9-1.9l-3.3-4.2a1.6 1.6 0 0 1 2.3-2.2L9 15.3z"/></svg><svg class="ar r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div><span></span></div><button class="x" type="button" aria-label="Đóng"></button></div></div>
<script type="module">
import { initMenu } from '/menu.js';
const N = 50, FPS = 25, IMG_AR = 3540 / 1536; // video tách tầng PhanTangTI_1st_V1, lặp PhanTangTI_2nd_V1
const preview = new URLSearchParams(location.search).has('preview');
const $ = (id) => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), bg = $('bg'), hs = $('hs'), spg = $('spg'), lb = $('lb');
const hint = $('hint'), bar = $('bar'), ctx = cv.getContext('2d'), bctx = bg.getContext('2d');
initMenu($('ui'), 'fly', { tab: 'matbang', noToggle: true });
const touch = matchMedia('(hover: none)').matches;
if (touch) hint.querySelector('.tx').textContent = 'Chạm để xem chi tiết';

const tour = await fetch('/api/tour').then((r) => r.json()).catch(() => ({}));
let views = (tour.split && tour.split.view) || {};
let spots = (tour.split && tour.split.hotspots) || [];
// thiết bị theo cỡ màn hình (khớp với khung xem trước trong admin)
const deviceKey = () => {
  const short = Math.min(innerWidth, innerHeight);
  if (short < 600) return innerWidth > innerHeight ? 'phoneLand' : 'phone';
  return innerWidth < 1200 && innerHeight > innerWidth * 0.8 ? 'tablet' : 'desktop';
};
const DEF = { cx: 0.4955, cy: 0.5, zoom: 1.286, label: 0.118 };
const view = () => ({ ...DEF, ...views[deviceKey()] });

// ---------- tải khung (lazy): khung đầu ưu tiên; phần còn lại chỉ tải khi trình duyệt rảnh & mạng tốt,
// hoặc ngay khi người xem rê chuột / chạm (sắp bấm); tải theo thứ tự, 6 song song (điện thoại 3) ----------
const W = window.SPLIT_W || 1280, url = (i) => `/split/${W}/f_${String(i).padStart(2, '0')}.webp?v=6`;
const frames = new Array(N).fill(null), waiters = [], pending = new Array(N);
let next = 1, active = 0, loaded = 0;
const PAR = Math.min(innerWidth, innerHeight) < 600 ? 4 : 6;
// vẽ thử 1 lần lên canvas 1×1 để trình duyệt giải mã + đưa lên GPU sẵn, lần vẽ thật đầu tiên không bị khựng
const wcx = document.createElement('canvas').getContext('2d'); wcx.canvas.width = wcx.canvas.height = 1;
const warmImg = (img) => { try { wcx.drawImage(img, 0, 0, 1, 1); } catch (e) {} };
const loadOne = (i) => pending[i] || (pending[i] = new Promise((res) => {
  const img = new Image(); img.decoding = 'async'; img.src = url(i);
  img.decode().then(() => { warmImg(img); frames[i] = img; loaded++; nLoaded++; res(); }, () => res());
}));
let pumping = false;
const startPump = () => { if (!pumping && !window.SPLIT_END && !tPumping) { pumping = true; pump(); } };

// ---------- video chuyển cảnh Phân tầng → Mặt bằng (48 khung, 24fps): tải trước hết, xong mới tới khung tách tầng ----------
const TN = 48, TFPS = 24, TAR = 1920 / 1080;
// vị trí khung f_00 trong khung cuối t_47 (đơn vị = bề rộng/cao khung t), đo bằng so ảnh khi dựng khung
const T_END = { x: -0.1452, y: 0, w: 1.2903, h: 1 };
const turl = (i) => `/split/trans/${window.TRANS_W}/t_${String(i).padStart(2, '0')}.webp?v=1`;
const tframes = new Array(TN).fill(null), tpending = new Array(TN);
let tnext = 0, tactive = 0, tPumping = false, tIdx = -1;
const tLoad = (i) => tpending[i] || (tpending[i] = new Promise((res) => {
  const img = new Image(); img.decoding = 'async'; img.src = turl(i);
  img.decode().then(() => { warmImg(img); tframes[i] = img; nLoaded++; res(); }, () => res());
}));
const tPump = () => {
  markT0();
  while (tactive < PAR && tnext < TN) {
    const i = tnext++; tactive++;
    tLoad(i).then(() => { tactive--; bar.firstChild.style.width = (nLoaded / seqLen() * 100) + '%'; waiters.splice(0).forEach((f) => f()); tPump(); });
  }
  // đã gửi hết khung chuyển cảnh → dùng chỗ trống để tải tiếp khung tách tầng, đường tải không bị hở
  if (tnext >= TN && tPumping) { tPumping = false; startPump(); }
};

// ---------- bộ đệm thích ứng: chỉ chạy (hoặc chạy tiếp sau khi hụt khung) khi phần đã tải đủ để chạy hết mà không phải dừng,
// ước theo tốc độ tải đo được. Chuyển cảnh + tách tầng tính là một chuỗi liền vì chúng nối nhau không nghỉ ----------
const TRANS_ON = !!window.SPLIT_TRANS && !preview;
let loadT0 = 0, nLoaded = 0;
function markT0() { if (!loadT0) loadT0 = performance.now(); }
const seqLen = () => (TRANS_ON ? TN : 0) + N;
const have = (k) => (TRANS_ON && k < TN ? tframes[k] : frames[k - (TRANS_ON ? TN : 0)]);
function canGo(p, fps) {
  const L = seqLen(); let c = p; while (c < L && have(c)) c++;
  // chỉ chạy khi đã tải + giải mã đủ cả chuỗi (chuyển cảnh + tách tầng): thanh tải hiện tiến độ, chạy một mạch không khựng.
  // Trang Phân tầng đã tải ngầm sẵn các khung này vào bộ nhớ đệm nên thường xong gần như ngay.
  return c >= L;
}
function whenReady(p, fps, cb) {
  let done = false; // thử lại khi có khung tải xong, và mỗi 250ms (điều kiện đo đủ 1 giây cần đồng hồ)
  const chk = () => { if (done) return; if (canGo(p, fps)) { done = true; bar.classList.remove('on'); cb(); } else { bar.classList.add('on'); waiters.push(chk); setTimeout(chk, 250); } };
  chk();
}
const pump = () => {
  markT0();
  while (active < PAR && next < N) {
    const i = next++; if (frames[i]) continue; active++;
    loadOne(i).then(() => { active--; bar.firstChild.style.width = (nLoaded / seqLen() * 100) + '%'; waiters.splice(0).forEach((f) => f()); if (next >= N && !active) loadCardImgs(); pump(); });
  }
};

// ---------- khung ảnh → màn hình (CSS px) ----------
let cur = 0, dpr = 1;
const geom = () => {
  const v = view(), w = innerWidth, h = innerHeight;
  const dh = Math.min(w / IMG_AR, h) * v.zoom, dw = dh * IMG_AR;
  return { dw, dh, dx: w / 2 - v.cx * dw, dy: h / 2 - v.cy * dh };
};
const toScreen = (x, y, g = geom()) => [g.dx + x * g.dw, g.dy + y * g.dh];
const fromScreen = (px, py, g = geom()) => [(px - g.dx) / g.dw, (py - g.dy) / g.dh];

const resize = () => {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  bg.width = 96; bg.height = Math.round(96 * innerHeight / innerWidth) || 54;
  const v = view(), tabsTop = Math.max(12, innerHeight * 0.0296) + 58 * (innerWidth <= 520 ? .72 : innerHeight <= 520 ? .66 : .78);
  stage.style.setProperty('--hb', Math.max(v.label * innerHeight, tabsTop + 10) + 'px');
  draw(cur); layoutSpots();
};
function paint(img, x, y, w, h, ar) {
  ctx.clearRect(0, 0, cv.width, cv.height); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, x * dpr, y * dpr, w * dpr, h * dpr);
  // nền mờ: cùng khung, phủ kín, vẽ ở độ phân giải rất thấp
  const bs = Math.max(bg.width / ar, bg.height);
  bctx.drawImage(img, (bg.width - bs * ar) / 2, (bg.height - bs) / 2, bs * ar, bs);
}
function draw(i) {
  if (tIdx >= 0) return drawTrans(tIdx);
  const img = (lIdx >= 0 && i === N - 1 && lframes[lIdx]) || frames[i]; if (!img) return;
  const g = geom();
  paint(img, g.dx, g.dy, g.dw, g.dh, IMG_AR);
}
// khung video chuyển cảnh: vị trí trên màn trượt dần từ chỗ ảnh mặt đứng ở Phân tầng tới chỗ khớp f_00 của Mặt bằng
let tStart = null;
const transStart = () => {
  try {
    const p = JSON.parse(sessionStorage.getItem('ptTrans') || 'null');
    // ảnh Phân tầng 2000×1125 cùng tỉ lệ với video → dùng đúng khung đó nếu màn chưa đổi cỡ
    if (p && Date.now() - p.t < 60000 && Math.abs(p.w - innerWidth) < 2 && Math.abs(p.h - innerHeight) < 2) return { x: p.left, y: p.tp, w: 2000 * p.s, h: 1125 * p.s };
  } catch {}
  const s = Math.max(innerWidth / TAR, innerHeight); // không có: phủ kín màn, đặt giữa
  return { x: (innerWidth - s * TAR) / 2, y: (innerHeight - s) / 2, w: s * TAR, h: s };
};
const transEnd = () => { const g = geom(), w = g.dw / T_END.w, h = g.dh / T_END.h; return { x: g.dx - T_END.x * w, y: g.dy - T_END.y * h, w, h }; };
function drawTrans(i) {
  const img = tframes[i]; if (!img) return;
  const a = tStart || (tStart = transStart()), b = transEnd(), t = i / (TN - 1), e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  const m = (k) => a[k] + (b[k] - a[k]) * e;
  paint(img, m('x'), m('y'), m('w'), m('h'), TAR);
}
function playTrans() {
  let t0 = performance.now(), base = 0;
  const tick = (t) => {
    let want = Math.min(TN - 1, base + Math.floor((t - t0) * TFPS / 1000));
    if (want - tIdx > 2) { t0 = t; base = tIdx; want = tIdx + 1; } // máy khựng: chạy tiếp từ khung đang có, không bỏ khung
    if (tIdx < want && tframes[tIdx + 1]) tIdx++;
    drawTrans(tIdx);
    if (tIdx === TN - 1) { // nối luôn khung tách tầng, không chờ
      const go = () => { if (!frames[0]) { loadOne(0).then(go); return; } tIdx = -1; cur = 0; play(); };
      return go();
    }
    if (tIdx < want) { whenReady(tIdx, TFPS, () => { t0 = performance.now(); base = tIdx; requestAnimationFrame(tick); }); return; }
    requestAnimationFrame(tick);
  };
  whenReady(0, TFPS, () => { t0 = performance.now(); requestAnimationFrame(tick); });
}

// ---------- hotspot: thẻ tiện ích + nhãn tầng, đường spine tới điểm chỉ ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON = {
  apt: '<svg viewBox="0 0 24 24"><path d="M4 21V9h7v12M11 21V3h9v18M3 21h18M14 7h1.5M16.5 7H18M14 11h1.5M16.5 11H18M14 15h1.5M16.5 15H18M6.5 13h2M6.5 16.5h2"/></svg>',
  amen: '<svg viewBox="0 0 24 24"><path d="M12 4 3 8.5l9 4.5 9-4.5z"/><path d="m3 12.5 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>'
};
let cards = [], editing = false;
function buildSpots() {
  hs.querySelectorAll('.hc').forEach((c) => c.remove());
  let order = 0;
  cards = spots.map((h) => {
    const d = document.createElement('div'), fl = h.kind === 'floor';
    d.className = 'hc' + (fl ? ' fl' : '') + (h.card ? ' pic' : ''); d.dataset.id = h.id;
    d.style.setProperty('--d', (fl ? 0.1 : 0.25 + order++ * 0.09) + 's');
    // có ảnh thẻ thiết kế sẵn → dùng nguyên ảnh; không có thì dựng thẻ bằng HTML
    d.innerHTML = h.card
      ? `<img class="full" alt="${esc(h.title)}" decoding="async" draggable="false">`
      : fl
        ? `<div class="in">${''}</div><i>${ICON[h.icon] || ICON.apt}</i><small>Mặt bằng</small><b>${esc(h.title)}</b>`
        : `<div class="in"><img alt="" decoding="async" draggable="false"></div><b>${esc(h.title)}</b><span>Xem ảnh</span>`;
    const im = d.querySelector('img'); if (im) im.dataset.src = (h.card || h.img || '');
    hs.append(d); return d;
  });
  if (cardImgsWanted) loadCardImgs();
  layoutSpots();
}
let cardImgsWanted = false;
function loadCardImgs() { cardImgsWanted = true; hs.querySelectorAll('img[data-src]').forEach((i) => { if (i.dataset.src) i.src = i.dataset.src; i.removeAttribute('data-src'); }); }

function layoutSpots() {
  if (!cards.length) return;
  const g = geom(), W0 = innerWidth, H0 = innerHeight, small = Math.min(W0, H0) < 600;
  const lw = Math.max(1, g.dw / 1920);
  hs.style.setProperty('--lw', lw + 'px');
  let svg = '';
  // màn dọc (điện thoại/tablet): ảnh chỉ chiếm dải giữa → xếp thẻ tiện ích thành 2 hàng ở khoảng trống trên/dưới ảnh, spine nối vào mô hình
  const rail = {};
  if (!editing && H0 > W0 * 1.15) {
    const list = spots.map((h, i) => ({ h, i })).filter((o) => o.h.kind !== 'floor').sort((a, b) => a.h.y - b.h.y);
    const half = Math.ceil(list.length / 2), rows = [list.slice(0, half), list.slice(half)];
    const imgTop = Math.max(0, g.dy), imgBot = Math.min(H0, g.dy + g.dh);
    rows.forEach((row, r) => {
      row.sort((a, b) => a.h.x - b.h.x);
      const n = row.length, w = Math.min(small ? 110 : 170, (W0 - 10 * (n + 1)) / n), hh = w * 0.538;
      const yc = r === 0 ? Math.max(58 + hh / 2, (58 + imgTop) / 2) : Math.min(H0 - 64 - hh / 2, imgBot + hh / 2 + 10); // hàng dưới nằm ngay dưới ảnh, trên thanh menu
      row.forEach((o, k) => { rail[o.i] = { w, x: 10 + w / 2 + k * (w + 10) + (W0 - n * w - (n + 1) * 10) / 2, y: yc }; });
    });
  }
  // ---- bước 1: cỡ + vị trí gốc từng thẻ. Cỡ theo khung ảnh nhưng có trần theo bề rộng màn: màn hẹp mà ảnh phóng to
  // (tablet, laptop nhỏ, điện thoại ngang) thẻ nhỏ lại để bớt che công trình ----
  const cap = (fl) => W0 * (fl ? 0.2 : (W0 < 1000 ? 0.15 : 0.145));
  const L = spots.map((h, i) => {
    const fl = h.kind === 'floor', rl = rail[i];
    const w = rl ? rl.w : Math.round(Math.min(fl ? 280 : 250, cap(fl), Math.max(small ? (fl ? (h.card ? 104 : 96) : 84) : (fl ? 116 : 100), g.dw * (h.card ? (fl ? 0.105 : 0.1) : 0.095))));
    const hh = w * (h.card ? (fl ? 0.322 : 0.538) : (fl ? 0.26 : 0.507));
    const [x, y] = rl ? [rl.x, rl.y] : toScreen(h.x, h.y, g);
    return { h, i, fl, rl, w, hh, x, y, x0: x, y0: y };
  });
  if (!editing) {
    const top = (o) => (small ? 46 : 60) + o.hh / 2, bot = (o) => H0 - (small ? 80 : 96) - o.hh / 2;
    const clamp = (o) => { o.x = Math.min(W0 - 8 - o.w / 2, Math.max(8 + o.w / 2, o.x)); o.y = Math.min(bot(o), Math.max(top(o), o.y)); };
    L.forEach((o) => { if (!o.rl) clamp(o); }); // kẹp vào trong màn (tránh logo và thanh menu); spine tự nối lại tới điểm chỉ
    // ---- bước 2: tách thẻ chạm nhau (cách nhau tối thiểu GAP px). Nhãn tầng giữ cố định; thẻ tiện ích bị đẩy RA NGOÀI
    // (xa tâm toà nhà) trước, chạm mép màn mới đẩy theo chiều dọc. Điểm chỉ trên mô hình không đổi, spine tự nối lại ----
    const GAP = small ? 6 : 10, mid = toScreen(0.5, 0.5, g)[0];
    const movable = L.filter((o) => !o.rl && !o.fl);
    // thân toà nhà (khoảng x 0.36–0.64 của ảnh, giữa các tầng): thẻ tiện ích lấn vào thì lùi ra ngoài, đủ chỗ trên màn mới lùi
    const [cx0] = toScreen(0.36, 0, g), [cx1] = toScreen(0.64, 0, g);
    movable.forEach((o) => {
      if (o.h.y < 0.3 || o.h.y > 0.8) return;
      if (o.x < mid && o.x + o.w / 2 > cx0) o.x = Math.max(8 + o.w / 2, cx0 - o.w / 2 - GAP);
      else if (o.x >= mid && o.x - o.w / 2 < cx1) o.x = Math.min(W0 - 8 - o.w / 2, cx1 + o.w / 2 + GAP);
    });
    for (let it = 0; it < 30; it++) {
      let moved = false;
      for (const a of movable) for (const b of L) {
        if (a === b || b.rl) continue;
        const ox = (a.w + b.w) / 2 + GAP - Math.abs(a.x - b.x), oy = (a.hh + b.hh) / 2 + GAP - Math.abs(a.y - b.y);
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        const both = !b.fl, k = both ? 0.5 : 1, px = a.x, dir = a.x < mid ? -1 : 1;
        a.x += dir * ox * k; clamp(a);
        if (Math.abs(a.x - px) < ox * k * 0.5) { // kẹt ở mép màn → tách theo chiều dọc
          const s = a.y < b.y || (a.y === b.y && a.i < b.i) ? -1 : 1;
          a.y += s * oy * k; if (both) b.y -= s * oy * k;
          clamp(a); if (both) clamp(b);
        }
      }
      if (!moved) break;
    }
  }
  L.forEach(({ h, i, fl, rl, w, x, y, x0, y0 }) => {
    const c = cards[i];
    c.style.setProperty('--w', w + 'px'); c.style.setProperty('--x', x + 'px'); c.style.setProperty('--y', y + 'px');
    if (fl || !h.pts.length) return;
    // trên hàng thẻ điện thoại bỏ các điểm gấp (thiết kế cho màn ngang), nối thẳng tới điểm chỉ
    // thẻ đã bị dời (tránh chạm / lùi khỏi toà nhà): các điểm gấp vẽ cho vị trí cũ sẽ làm spine gãy ngược qua thẻ → nối thẳng tới điểm chỉ
    const bent = !rl && Math.hypot(x - x0, y - y0) < 2;
    const pts = [[x, y], ...(bent ? h.pts : h.pts.slice(-1)).map((q) => toScreen(q[0], q[1], g))];
    // vẽ từ điểm chỉ ra thẻ để hiệu ứng "mọc" từ mô hình
    const d = 'M' + pts.slice().reverse().map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    const [ex, ey] = pts[pts.length - 1], del = c.style.getPropertyValue('--d');
    svg += `<g class="sg" data-i="${i}" style="--d:${del}"><path class="gl" pathLength="1" d="${d}"/><path class="wl" pathLength="1" d="${d}"/><path class="fl" pathLength="1" d="${d}"/>`
      + `<circle class="rg" cx="${ex}" cy="${ey}" r="${3.5 * lw}"/><circle class="dt" cx="${ex}" cy="${ey}" r="${3.5 * lw}"/>`
      + `<path class="hit" d="${d}"/>` + pts.slice(1).map((p, j) => `<circle class="hd${j === pts.length - 2 ? ' end' : ''}" data-i="${i}" data-j="${j}" cx="${p[0]}" cy="${p[1]}" r="7"/>`).join('') + '</g>';
  });
  spg.innerHTML = svg;
}
// khung cuối chất lượng cao nhất: chỉ tải SAU khi video đã chạy tới cuối (không tranh băng thông với khung chạy),
// giải mã xong mới thay vào khung cuối và vẽ lại. Mạng chậm / tiết kiệm dữ liệu thì bỏ qua, giữ khung thường.
let endHQ = false;
function loadEndHQ() {
  if (endHQ || preview) return; endHQ = true;
  // mạng chậm / tiết kiệm dữ liệu: vẫn tải, cỡ khung đã hạ 1 bậc nên end.webp (cao hơn 1 bậc) vừa đúng độ nét màn hình; đợi lúc rảnh mới tải
  const go = () => { const img = new Image(); img.decoding = 'async'; img.fetchPriority = 'low';
  img.src = `/split/${W}/end.webp?v=6`;
  img.decode().then(() => { warmImg(img); frames[N - 1] = img; if (cur === N - 1 && tIdx < 0) draw(cur); }, () => {}); };
  window.SPLIT_SLOW ? (window.requestIdleCallback || ((f) => setTimeout(f, 1500)))(go, { timeout: 4000 }) : go();
}
// ---------- vòng lặp sau khi tách tầng xong (video PhanTangTI_2nd): l_00 trùng khung cuối f_49, l_49 ≈ l_00 →
// lặp l_01..l_48 rồi quay về l_00 liền mạch. Chỉ tải SAU khi hotspot đã hiện, lúc trình duyệt rảnh, tuần tự 2–3 khung một lúc;
// tải đủ cả vòng mới bắt đầu lặp (không giật). Bỏ qua khi mạng chậm / tiết kiệm dữ liệu / giảm chuyển động / admin xem trước:
// khi đó đứng yên ở khung cuối như cũ. Tối đa 1920px để 50 khung giải mã không chiếm quá nhiều RAM/GPU. ----------
const LN = 50, LFPS = 25, LW = Math.min(W, 1920);
const lurl = (i) => `/split/loop/${LW}/l_${String(i).padStart(2, '0')}.webp?v=1`;
const lframes = new Array(LN).fill(null);
let lIdx = -1, lStarted = false, lRaf = 0, lHold = false;
const LOOP_OK = !preview && !window.SPLIT_SLOW && !matchMedia('(prefers-reduced-motion: reduce)').matches;
function loadLoop() {
  if (lStarted || !LOOP_OK) return; lStarted = true;
  let nx = 0, act = 0, got = 0; const par = Math.min(innerWidth, innerHeight) < 600 ? 2 : 3;
  const step = () => {
    while (act < par && nx < LN) {
      const i = nx++; act++;
      const img = new Image(); img.decoding = 'async'; img.fetchPriority = 'low'; img.src = lurl(i);
      img.decode().then(() => { warmImg(img); lframes[i] = img; got++; }, () => {}).finally(() => { act--; if (got === LN) startLoop(); else step(); });
    }
  };
  (window.requestIdleCallback || ((f) => setTimeout(f, 300)))(step, { timeout: 1500 });
}
function startLoop() {
  if (lRaf || lframes.some((f) => !f)) return;
  // nhả các khung chạy giữa (giữ khung đầu + cuối) để bớt RAM; chạy lại thì tải lại như bình thường
  for (let i = 1; i < N - 1; i++) { frames[i] = null; pending[i] = undefined; } next = 1; pumping = false;
  let t0 = performance.now(), base = 0;
  const tick = (t) => {
    lRaf = requestAnimationFrame(tick);
    if (lHold || lb.classList.contains("on") || cur !== N - 1 || playing || tIdx >= 0 || document.hidden) { t0 = t; base = Math.max(lIdx, 0); return; }
    const k = (base + Math.floor((t - t0) * LFPS / 1000)) % (LN - 1); // l_49 ≈ l_00: bỏ khung trùng cho vòng liền
    if (k !== lIdx) { lIdx = k; draw(cur); }
  };
  lRaf = requestAnimationFrame(tick);
}
function stopLoop() { lIdx = -1; }
function reveal(instant) {
  loadCardImgs(); setTimeout(loadEndHQ, instant ? 0 : 600); setTimeout(loadLoop, instant ? 400 : 1200);
  hs.classList.toggle('instant', !!instant);
  hs.classList.remove('on'); void hs.offsetWidth; hs.classList.add('on');
  if (!instant) { const s = $('scan'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }
}
const hideSpots = () => hs.classList.remove('on');

// ---------- bảng xem ảnh ----------
const lbImg = lb.querySelector('img');
function lbFit() {
  const mob = innerWidth < 700 && innerHeight > innerWidth;
  lb.classList.toggle('mob', mob);
  lb.style.setProperty('--k', Math.min(1, (innerWidth - 24) / 1600, (innerHeight - 24) / 956));
}
// ---------- bộ ảnh nhiều tab: chỉ tải ảnh đang xem (srcset theo bề rộng khung thật × DPR) + tải sẵn ảnh kề ----------
const gTabs = lb.querySelector('.tb'), gPh = lb.querySelector('.ph'), gPrev = lb.querySelector('.nv.p'), gNext = lb.querySelector('.nv.n'), gSw = lb.querySelector('.sw');
gSw.querySelector('span').textContent = touch ? 'Vuốt trái / phải để xem ảnh' : 'Kéo trái / phải để xem ảnh';
const gSlow = (() => { const c = navigator.connection || {}; return !!c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''); })();
let gal = null, gT = 0, gI = 0, gSwT = 0;
const gBase = (u) => u.replace(/-\d+\.webp$/, '');
const gSet = (u) => [1280, 2048, 2880].map((w) => `${gBase(u)}-${w}.webp ${w}w`).join(', ');
const gSizes = () => Math.round(lb.classList.contains('mob') ? innerWidth - 32 : 1357 * parseFloat(lb.style.getPropertyValue('--k') || 1)) + 'px';
const gWarm = new Set();
function gPrefetch(i) {
  const ph = gal[gT].photos; if (i < 0 || i >= ph.length || gWarm.has(ph[i])) return; gWarm.add(ph[i]);
  const im = new Image(); im.fetchPriority = 'low'; im.decoding = 'async'; im.sizes = gSizes(); im.srcset = gSet(ph[i]);
}
const gHint = (on) => { clearTimeout(gSwT); gSw.classList.toggle('on', on); if (on) gSwT = setTimeout(() => gSw.classList.remove('on'), 5000); };
function gShow() {
  const ph = gal[gT].photos, u = ph[gI];
  gTabs.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k === gT); b.setAttribute('aria-selected', k === gT); });
  gPrev.disabled = gI === 0; gNext.disabled = gI === ph.length - 1;
  lbImg.classList.remove('ok'); lbImg.alt = `${gal[gT].title} ${gI + 1}/${ph.length}`;
  lbImg.fetchPriority = 'high'; lbImg.sizes = gSizes(); lbImg.srcset = gSet(u); lbImg.src = u;
  const me = u, done = () => { if (gal && gal[gT].photos[gI] === me) { lbImg.classList.add('ok'); gPrefetch(gI + 1); if (!gSlow) gPrefetch(gI - 1); } };
  lbImg.decode().then(done, done);
}
const gGo = (d) => { if (!gal) return; const n = gI + d; if (n < 0 || n >= gal[gT].photos.length) return; gI = n; gHint(false); gShow(); };
gPrev.onclick = () => gGo(-1); gNext.onclick = () => gGo(1);
gTabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !gal) return; const t = +b.dataset.t; if (t === gT) return; gT = t; gI = 0; gHint(false); gShow(); });
// kéo chuột / vuốt ngang để chuyển ảnh
let gX = null;
gPh.addEventListener('pointerdown', (e) => { if (!gal) return; gX = e.clientX; gPh.classList.add('drag'); gHint(false); });
addEventListener('pointerup', (e) => { if (gX === null) return; const dx = e.clientX - gX; gX = null; gPh.classList.remove('drag'); if (Math.abs(dx) > 40) gGo(dx < 0 ? 1 : -1); });
addEventListener('pointercancel', () => { gX = null; gPh.classList.remove('drag'); });
function openGallery(h) {
  gal = h.gallery; gT = 0; gI = 0;
  lb.classList.add('gal'); lbFit();
  gTabs.innerHTML = gal.map((t, k) => `<button type="button" role="tab" data-t="${k}">${t.title.replace(/</g, '&lt;')}</button>`).join('');
  gShow();
  lb.classList.add('on'); requestAnimationFrame(() => lb.classList.add('show'));
  gHint(false); setTimeout(() => { if (gal) gHint(true); }, 500);
  lb.querySelector('.x').focus({ preventScroll: true });
}
function openPhoto(h) {
  if (h.gallery && h.gallery.length) return openGallery(h);
  if (!h.photo) return;
  gal = null; lb.classList.remove('gal'); lbImg.removeAttribute('srcset'); lbImg.removeAttribute('sizes');
  lbFit(); lb.querySelector('h2').textContent = h.title;
  const pw = Math.min(innerWidth, 1357) * Math.min(devicePixelRatio || 1, 2);
  lbImg.classList.remove('ok'); lbImg.alt = h.title;
  lbImg.src = pw <= 1400 ? h.photo.replace(/-2048\.webp$/, '-1280.webp') : h.photo;
  lbImg.decode().then(() => lbImg.classList.add('ok'), () => lbImg.classList.add('ok'));
  lb.classList.add('on'); requestAnimationFrame(() => lb.classList.add('show'));
  lb.querySelector('.x').focus({ preventScroll: true });
}
const closePhoto = () => { gHint(false); gal = null; lb.classList.remove('show'); setTimeout(() => lb.classList.remove('on'), 300); };
lb.addEventListener('click', (e) => { if (e.target === lb || e.target.closest('.x') || (lb.classList.contains('mob') && e.target.classList.contains('pn'))) closePhoto(); });
addEventListener('keydown', (e) => { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') closePhoto(); else if (gal && e.key === 'ArrowLeft') gGo(-1); else if (gal && e.key === 'ArrowRight') gGo(1); });

hs.addEventListener('click', (e) => {
  const c = e.target.closest('.hc'); if (!c || editing || moved) return;
  const h = spots.find((x) => x.id === c.dataset.id); if (!h) return;
  if (h.kind === 'floor') { // nhãn tầng tiện ích → trang sơ đồ tiện ích; tầng khác → trang tầng
    const to = h.icon === 'amen' ? '/tienich' : '/floor.html?view=2d';
    // nút lùi của trình duyệt cũng quay về khung cuối
    if (to) { history.replaceState(null, '', '/matbang?end=1'); stage.classList.add('leave'); setTimeout(() => (location.href = to), 400); }
  }
  else openPhoto(h);
});

// ---------- chạy khung 0 → cuối rồi dừng, sau đó hiện hotspot ----------
let playing = false;
function play() {
  if (playing || tIdx >= 0 || cur === N - 1) return;
  window.SPLIT_END = false; startPump();
  playing = true; hint.classList.add('off'); stage.classList.add('done');
  let t0 = performance.now(), base = cur;
  const tick = (t) => {
    let want = Math.min(N - 1, base + Math.floor((t - t0) * FPS / 1000));
    if (want - cur > 2) { t0 = t; base = cur; want = cur + 1; } // máy khựng: chạy tiếp từ khung đang có, không bỏ khung
    if (cur < want && frames[cur + 1]) cur++;
    draw(cur);
    if (cur === N - 2) loadCardImgs();
    if (cur === N - 1) { playing = false; bar.classList.remove('on'); reveal(false); return; }
    if (cur < want) { // khung kế chưa tải xong: đệm lại đủ rồi mới chạy tiếp, không nhảy cóc, không giật từng khung
      whenReady(off + cur, FPS, () => { t0 = performance.now(); base = cur; requestAnimationFrame(tick); });
      return;
    }
    requestAnimationFrame(tick);
  };
  const off = TRANS_ON ? TN : 0;
  whenReady(off + cur, FPS, () => { t0 = performance.now(); base = cur; requestAnimationFrame(tick); });
}
function reset() { stopLoop(); playing = false; cur = 0; draw(0); hideSpots(); hint.classList.remove('off'); stage.classList.remove('done'); }
function jumpEnd(instant) {
  const go = () => { if (!frames[N - 1]) { loadOne(N - 1).then(go); return; } playing = false; cur = N - 1; draw(cur); hint.classList.add('off'); stage.classList.add('done'); reveal(instant); };
  go();
}
stage.addEventListener('pointerup', (e) => { if (e.button === 0 && !e.target.closest('.mn .box') && !e.target.closest('.hc')) play(); });
addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !lb.classList.contains('on')) play(); });
addEventListener('pageshow', (e) => { if (e.persisted) stage.classList.remove('leave'); }); // trình duyệt khôi phục trang từ bộ nhớ đệm khi bấm lùi
addEventListener('resize', () => { resize(); if (lb.classList.contains('on')) lbFit(); });

// ---------- admin: chế độ sửa hotspot trong khung xem trước ----------
let drag = null, moved = false;
const sendSpots = () => parent.postMessage({ type: 'hotspots', hotspots: spots }, location.origin);
hs.addEventListener('pointerdown', (e) => {
  if (!editing) return;
  const c = e.target.closest('.hc'), hd = e.target.closest('.hd');
  if (hd) drag = { h: spots[+hd.dataset.i], j: +hd.dataset.j };
  else if (c) { const h = spots.find((x) => x.id === c.dataset.id), [sx, sy] = toScreen(h.x, h.y); drag = { h, ox: e.clientX - sx, oy: e.clientY - sy }; }
  else return;
  moved = false; hs.setPointerCapture(e.pointerId); e.preventDefault();
});
hs.addEventListener('pointermove', (e) => {
  if (!drag) return; moved = true;
  const r = (v) => +Math.min(1, Math.max(0, v)).toFixed(4);
  if (drag.j !== undefined) { const [x, y] = fromScreen(e.clientX, e.clientY); drag.h.pts[drag.j] = [r(x), r(y)]; }
  else { const [x, y] = fromScreen(e.clientX - drag.ox, e.clientY - drag.oy); drag.h.x = r(x); drag.h.y = r(y); }
  layoutSpots();
});
hs.addEventListener('pointerup', () => { if (drag) { drag = null; sendSpots(); setTimeout(() => (moved = false)); } });
hs.addEventListener('dblclick', (e) => {
  if (!editing) return;
  const hd = e.target.closest('.hd'), hit = e.target.closest('.hit');
  if (hd) { // xoá điểm gấp (giữ lại điểm chỉ cuối)
    const h = spots[+hd.dataset.i]; if (h.pts.length > 1) { h.pts.splice(+hd.dataset.j, 1); layoutSpots(); sendSpots(); }
  } else if (hit) { // thêm điểm gấp vào đoạn gần nhất
    const h = spots[+hit.parentNode.dataset.i], p = fromScreen(e.clientX, e.clientY), chain = [[h.x, h.y], ...h.pts];
    let best = 0, bd = Infinity;
    for (let k = 0; k < chain.length - 1; k++) {
      const [ax, ay] = chain[k], [bx, by] = chain[k + 1], dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((p[0] - ax) * dx + (p[1] - ay) * dy) / (dx * dx + dy * dy || 1)));
      const d = Math.hypot(ax + t * dx - p[0], ay + t * dy - p[1]); if (d < bd) { bd = d; best = k; }
    }
    h.pts.splice(best, 0, [+p[0].toFixed(4), +p[1].toFixed(4)]); layoutSpots(); sendSpots();
  }
});

// admin xem trước: nhận khung hình đang chỉnh, hotspot và lệnh chạy / về đầu / sửa
if (preview) addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data) return;
  const m = e.data;
  if (m.type === 'view') { views = { ...views, ...m.view }; resize(); }
  if (m.type === 'play') { reset(); play(); }
  if (m.type === 'reset') reset();
  if (m.type === 'end') jumpEnd(false);
  if (m.type === 'hotspots') { spots = m.hotspots; buildSpots(); }
  if (m.type === 'edit') { editing = !!m.on; hs.classList.toggle('edit', editing); layoutSpots(); if (editing) jumpEnd(true); }
});

buildSpots();
if (window.SPLIT_TRANS && !preview) {
  history.replaceState(null, '', '/matbang'); // F5 / nút lùi không chạy lại chuyển cảnh
  tPumping = true; tPump(); loadOne(0);
  await tLoad(0); tIdx = 0; resize(); stage.classList.add('done'); playTrans();
} else {
  if (window.SPLIT_END) { await loadOne(N - 1); cur = N - 1; resize(); jumpEnd(true); } else { await loadOne(0); resize(); }
  startPump();
  // vào thẳng trang (không phải quay lại): khung đầu hiện ra là chạy luôn
  if (!window.SPLIT_END && !preview) setTimeout(play, 300);
}
// sắp bấm (rê chuột / chạm / phím) → bắt đầu tải ngay
for (const ev of ['pointerover', 'pointerdown', 'touchstart', 'keydown']) addEventListener(ev, startPump, { once: true, passive: true });
</script>
